[UI]
name = "DBS Banking Assistant"
logo = ""

[features]
# Enable custom theme
theme = "custom"

[theme]
# Primary color for buttons, links, and accents (lighter shade)
primary = "#2C3E50"
# Secondary color (lighter shade)
secondary = "#3498DB"
# Text color on primary background
text_primary = "#ffffff"
# Background colors
background = "#f8f9fa"
background_secondary = "#ffffff"
# Border colors
border = "#e0e0e0"

# CSS custom properties for fine-grained control
custom_css = ".chainlit/custom.css"
